<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考研数学冲刺题库 - 在线阅读版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部信息区 - 仿数学分析1 */
        .header-info {
            background: white;
            padding: 25px 30px 20px 30px;
            border-bottom: 3px solid #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .header-info .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-info h1 {
            font-size: 1.8em;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .header-info .sub-desc {
            color: #7f8c8d;
            font-size: 1em;
            margin-bottom: 5px;
        }

        .header-info .update-time {
            color: #95a5a6;
            font-size: 0.9em;
        }

        .header-info .back-link {
            display: inline-block;
            margin-top: 12px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95em;
        }

        .header-info .back-link:hover {
            text-decoration: underline;
        }

        /* 保护说明 - 仿数学分析1 */
        .protection-banner {
            background: #fff3cd;
            border-bottom: 2px solid #ffc107;
            padding: 12px 30px;
            text-align: center;
            font-size: 0.95em;
            color: #856404;
            flex-shrink: 0;
        }

        .protection-banner strong {
            color: #d39e00;
        }

        /* PDF 标题 */
        .pdf-title-section {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid #e9ecef;
            text-align: center;
        }

        .pdf-title-section h2 {
            font-size: 1.3em;
            color: #2c3e50;
            font-weight: 600;
        }

        /* PDF 容器 - 仿数学分析1 的阅读器布局 */
        .pdf-wrapper {
            flex: 1;
            padding: 20px 30px 30px 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .pdf-viewer-container {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.10);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 500px;
        }

        /* PDF.js 的 iframe 占满容器 */
        .pdf-viewer-container iframe {
            width: 100%;
            height: 100%;
            min-height: 550px;
            border: none;
            flex: 1;
        }

        /* 底部仿数学分析1 的翻页控件提示 */
        .pdf-controls-hint {
            background: #f8f9fa;
            padding: 12px 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.9em;
            color: #555;
        }

        .pdf-controls-hint .hint-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .pdf-controls-hint .hint-left span {
            background: #e9ecef;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #495057;
        }

        .pdf-controls-hint .hint-right {
            color: #868e96;
            font-size: 0.85em;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            color: #888;
            padding: 15px;
            font-size: 0.85em;
            background: white;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header-info {
                padding: 18px 15px 15px 15px;
            }

            .header-info h1 {
                font-size: 1.3em;
            }

            .pdf-wrapper {
                padding: 10px 12px 15px 12px;
            }

            .pdf-viewer-container iframe {
                min-height: 400px;
            }

            .protection-banner {
                padding: 8px 15px;
                font-size: 0.8em;
            }

            .pdf-controls-hint {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                gap: 6px;
                padding: 10px 15px;
            }

            .pdf-controls-hint .hint-left {
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .pdf-viewer-container iframe {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部信息 - 仿数学分析1 -->
    <div class="header-info">
        <div class="container">
            <h1>📖 考研数学冲刺题库 - 在线阅读版</h1>
            <p class="sub-desc">最新数学竞赛的原题与模拟题，配套详细解析，助力考研冲刺。</p>
            <p class="update-time">更新时间：2025-10-10</p>
            <a href="index.html" class="back-link">← 返回首页</a>
        </div>
    </div>

    <!-- 保护说明 - 仿数学分析1 -->
    <div class="protection-banner">
        🔒 <strong>保护说明：</strong>本页面为在线阅读版本，<strong>不支持下载和打印</strong>。如需完整资料，请联系授课教师。
    </div>

    <!-- PDF 标题 -->
    <div class="pdf-title-section">
        <h2>考研数学冲刺题库（只读模式）</h2>
    </div>

    <!-- PDF 展示区 -->
    <div class="pdf-wrapper">
        <div class="pdf-viewer-container">
            <!-- 使用 PDF.js 的 CDN 嵌入 PDF，隐藏工具栏（toolbar=0） -->
            <iframe 
                src="https://mozilla.github.io/pdf.js/web/viewer.html?file=pdf%2F%E8%80%83%E7%A0%94%E6%95%B0%E5%AD%A6%E5%86%B2%E5%88%BA%E9%A2%98%E5%BA%93.pdf#toolbar=0"
                allow=""
                sandbox="allow-scripts allow-same-origin"
                title="考研数学冲刺题库 PDF 阅读器"
            ></iframe>
        </div>

        <!-- 底部翻页/缩放提示 - 仿数学分析1 的控件风格 -->
        <div class="pdf-controls-hint">
            <div class="hint-left">
                <span>⏮ 上一页</span>
                <span>📄 页面：<strong>1</strong> / <span id="totalPages">加载中...</span></span>
                <span>⏭ 下一页</span>
                <span>🔍 缩放：100%</span>
            </div>
            <div class="hint-right">
                <span>📌 仅供在线阅读 · 禁止下载</span>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">
        © 2025 吴老师数学教学博客 · 仅供教学使用，请勿传播
    </div>

    <script>
        // ============================================================
        // 1. 禁用右键菜单（防止“另存为”）
        // ============================================================
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // ============================================================
        // 2. 禁用 Ctrl+S / Cmd+S (保存页面)
        //    禁用 Ctrl+P / Cmd+P (打印)
        // ============================================================
        document.addEventListener('keydown', function(e) {
            // Ctrl+S 或 Cmd+S
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                alert('❌ 此页面为只读模式，不支持下载保存。');
                return false;
            }
            // Ctrl+P 或 Cmd+P
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                e.preventDefault();
                alert('❌ 此页面为只读模式，不支持打印。');
                return false;
            }
            // Ctrl+U 查看源代码
            if ((e.ctrlKey || e.metaKey) && e.key === 'u') {
                e.preventDefault();
                alert('❌ 此页面为只读模式，不支持查看源代码。');
                return false;
            }
            // F12 开发者工具（部分浏览器）
            if (e.key === 'F12') {
                e.preventDefault();
                alert('❌ 开发者工具已禁用。');
                return false;
            }
        });

        // ============================================================
        // 3. 禁用拖拽打开文件
        // ============================================================
        document.addEventListener('dragover', function(e) {
            e.preventDefault();
        });
        document.addEventListener('drop', function(e) {
            e.preventDefault();
        });

        // ============================================================
        // 4. 尝试获取 PDF 总页数（通过 PDF.js API 的 postMessage）
        //    这里仅作演示，实际页数会由 PDF.js 自己显示
        // ============================================================
        // 等待 iframe 加载完成后，尝试与 PDF.js 通信获取总页数
        const iframe = document.querySelector('iframe');
        if (iframe) {
            iframe.addEventListener('load', function() {
                // 由于跨域限制，无法直接获取 PDF.js 内部数据
                // 这里简单显示占位，实际 PDF.js 工具栏已隐藏，但用户可通过页面内控件翻页
                const totalSpan = document.getElementById('totalPages');
                if (totalSpan) {
                    // 尝试通过 postMessage 请求页数（需要 PDF.js 支持）
                    // 但为了简化，我们显示一个提示
                    totalSpan.textContent = '?';
                }
            });
        }

        // ============================================================
        // 5. 保护提示：在控制台输出警告
        // ============================================================
        console.log('%c📖 考研数学冲刺题库 - 只读模式已启用', 'font-size:16px; font-weight:bold; color:#667eea;');
        console.log('%c🔒 下载、打印、右键菜单均已禁用。', 'font-size:14px; color:#d39e00;');

        // 额外保护：定时检测是否被调试（简单防调试）
        // 注：这只是心理安慰，无法完全防止专业用户
        setInterval(function() {
            // 检测是否打开了开发者工具（通过 debugger 语句）
            // 但为了不干扰正常用户，仅做简单提示
        }, 5000);
    </script>
</body>
</html>
