<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026硕士研究生数学一试题解析</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-size: 14px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
        }
        
        .pdf-frame {
            width: 100%;
            height: calc(100vh - 60px); /* 减去头部高度 */
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>2026硕士研究生数学一试题解析</h1>
        <p style="margin: 5px 0; font-size: 12px;">仅供在线阅读 · 返回<a href="index.html" style="color: #3498db; margin-left: 10px;">首页</a></p>
    </div>
    
    <!-- 直接嵌入PDF -->
    <iframe 
        class="pdf-frame"
        src="pdf/2026研究生入学考试数学一试题.pdf#toolbar=0&navpanes=0"
        title="2026硕士研究生数学一试题解析"
    >
        <p>您的浏览器不支持PDF显示。</p>
    </iframe>
    
    <script>
        // 最简单的保护：禁用右键
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        
        // 禁用键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 's' || e.key === 'p')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
